name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: udomsasn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d udomsasn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/udomsasn_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/udomsasn_test?schema=public
      JWT_SECRET: integration-test-jwt-secret-at-least-32-characters
      CODE_HASH_SECRET: integration-test-code-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run prisma:generate
        working-directory: backend
      - run: npm run prisma:deploy
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
